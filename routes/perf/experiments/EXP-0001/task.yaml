protocol_version: v0.6
route: perf
experiment_id: EXP-0001
objective: "测量 DeepSeek-V4.1-Flash 在 8×SM120、固定 main 提交下的原生基线，取得分阶段、多 rank 的 profiler 证据，用于筛选改动小的优化点。"
hypothesis: "实际 serving 路径中可能存在可消除的拷贝、同步或重复准备开销；若关键路径主要由现有高效计算或必要通信占据，且没有暴露的冗余，则不支持优先做此类框架小优化。"
code:
  repo: zooeyQAQ/sglang
  branch: dev/perf
  start_commit: "faa56e2b5c5c5dee60eb5dd7b6251944a21a6104"
  scope: "不修改被测生产代码或测试代码，不增加 monkeypatch、运行时 hook 或依赖 overlay。已有 benchmark、profiler 和分析工具可直接使用；辅助脚本如需新写，必须在相应正式 run 前提交并记录固定来源。"
baseline:
  reference: "none：本路线首次原生基线采集。所有 case 使用上述同一 SHA；本轮无优化候选，不从跨版本或跨路线数字推导收益。"
workload:
  config:
    machine: "用户已授权的主 PRO5000 机器，仅容器 zooey_sglang0_5_22_dsv41_8005 的 GPU 0-7；主机实际身份写入结果。"
    worktree: /data/sgl_pr/worktrees/perf
    pythonpath: /data/sgl_pr/worktrees/perf/python
    python: /opt/sglang/bin/python3
    model: /data1/models/DeepSeek-V4.1-Flash
    endpoint: "本实验新建的本机 Python serving /generate；默认绑定 127.0.0.1:30000。若端口已占用，选另一未占用本机端口并记录，不停止占用者。"
    deployment: "PP1/TP8/EP8，CP=1，mem_fraction_static=0.80，page_size=256，chunked_prefill_size=8192，max_running_requests=8；DSpark/MTP、PD、DP attention、HiCache 和 offload 关闭。"
    graphs_and_backends: "使用固定提交在本机解析出的原生默认 graph/backend 配置，记录 effective server args 和相关环境变量；不手动切换 backend 或 graph 模式来补救。"
    cache: "禁用 radix/prefix cache，以免重复输入命中改变本轮冷前缀负载；计时轮次之间确保无在途请求。"
    client: "该 SHA 的 python -m sglang.benchmark.serving，backend=sglang，dataset=random，random_range_ratio=0，seed=42，temperature=0，ignore_eos=true，streaming=true，request_rate=inf；保存实际 token 数和逐请求数据。每轮保持相同生成规则。"
  cases:
    - {id: A, input_tokens: 8192, output_tokens: 1, concurrency: 1, timing_requests: 8, warmup_requests_per_repeat: 2}
    - {id: B, input_tokens: 20480, output_tokens: 1, concurrency: 1, timing_requests: 4, warmup_requests_per_repeat: 2}
    - {id: C, input_tokens: 2048, output_tokens: 256, concurrency: 1, timing_requests: 8, warmup_requests_per_repeat: 2}
    - {id: D, input_tokens: 2048, output_tokens: 256, concurrency: 8, timing_requests: 32, warmup_requests_per_repeat: 16}
  repeats: "各 case 先做 3 轮独立的无 profiler 计时，按 A/B/C/D 顺序，每轮采用表中同并发 warmup。若某 case 的三轮输出吞吐（C/D 另查 TPOT p50）的极差/中位数 >10%，仅允许原条件再补 2 轮；仍 >10% 则标记该 case 噪声未收敛。每 case 另做 1 次 profiler 采集，不计入性能数字。"
procedure:
  - "本任务提交同步 GitHub 后可直接执行；用户已授权本路线与本轮测量，无需再次请求逐项确认。启动时一次性记录 SHA、clean diff、实际 import/构建来源、模型配置、镜像/驱动及关键依赖版本、完整命令和有效环境；不另开可行性 EXP，也不以包版本号不完全相同单独判定失败。"
  - "使用固定 SHA 自带客户端，按 workload 进行未插桩计时；输出 summary 与逐请求原始数据。报告 TTFT、TPOT/ITL、输出 token/s、请求数、实际长度和三轮范围；这些是探索性基线，不解释为容量上限或可靠的尾延迟 SLA。"
  - "计时后另行开启 CPU+GPU profiler，采集 A/B 的完整 prefill 请求，B 覆盖全部 chunk；采集 C/D 至少连续 10 个稳态 decode forward，排除首次 prefill、graph capture 和服务启动，D 的分析窗口须标明实际 batch size。采集前每 case 再做同形状预热，至少覆盖 10 个相关 forward。"
  - "保留全部 8 个 TP rank 的原始 trace，检查本次新产物、GPU events 与阶段完整性。优先使用此 SHA 的原生 profiler 控制，结合 .agents/skills/llm-torch-profiler-analysis 的离线分析；不能使用其默认 4090/1 或 1/2048 替代本轮负载。工具参数拼写或采集窗口可按固定源码适配，不能修改模型或 profiler 实现。"
  - "若 trace 缺少所需阶段/GPU events 或窗口未覆盖目标，仅允许同负载重新采集 1 次，另存 run 并保留无效 trace；仍无效则停止对应 case。归因不足标为 unknown，不另外切换 graph-off 服务做 mapping。"
  - "按 rank 分析再比较：输出 kernel/source、overlap opportunity、fusion pattern 三张表，区分 kernel 时长之和、GPU busy union 和 wall time，标明 rank skew、归因置信度和最多 5 个待验证假设；没有可信小优化点也如实报告。"
  - "证据分别写入 /data/sgl_pr/runs/perf/EXP-0001/<case>/<run>/，不得覆盖。Executor 写 result.md，记录 plan_commit 为本任务正式运行前的 labbook 完整提交及辅助脚本固定来源，并按 v0.6 在结果提交中更新路线入口；仅清理本实验启动的进程。"
acceptance:
  - "A/B/C/D 均具备至少 3 轮有效、无 profiler 干扰的基线计时和可恢复的原始请求记录；按上述噪声规则补测后仍波动 >10% 的必需 case，整体为 inconclusive，不挑选最好一轮。"
  - "每 case 有本次生成的有效 profiler 证据：8 个 rank 均有 GPU events，A/B 覆盖所需 prefill，C/D 覆盖至少 10 个完整稳态 decode forward；声明捕获窗口和实际 batch size。"
  - "完成三表及关键路径/不确定项报告。pass 表示证据满足采集合同，不表示发现了优化、不表示已经加速或完成精度验证。"
stop_conditions:
  - "出现资源被其他路线占用、导入到 live 树、代码/辅助脚本在对应 run 中变化、请求错误导致计时口径失效，立即停止相关测量并保留证据；不得停止其他路线服务。"
  - "出现阻碍测量的缺失 API/ABI、OOM、崩溃、卡死或 profiler 控制不兼容，记录实际阻塞并停止；不得临场改代码、装包、切 graph/backend、减小既定负载或更换 SHA。"
  - "服务启动 30 分钟仍未 ready，或单轮测量连续 10 分钟没有请求/step 进展，保留日志并停止本实验服务。"
  - "仅允许上面预定的噪声补测和 trace 重采；若需要改变研究问题、部署条件或采集方式的实质语义，反馈 Planner 后另行安排。"
