route: C1-ORDER
experiment_id: EXP-0004
protocol_version: "0.5"
status: pass
task:
  id: TASK-C1-ORDER-0004
objective: >
  On the EXP-0003 probe tree (v0.5.22 + PR #42371), rerun the N511 × N8193
  × L2/L8/L14/L20 index-order matrix without DP attention: TP8 only, lower
  mem-fraction-static, and test whether the N511 L20 same-score same-set
  different-order finding plus N8193 C2-above-K reproduce.
hypothesis: >
  EXP-0003 N511 L20 order fork is not an artifact of DP8 attn_tp=1. The same
  same-score same-set different-order pattern should appear on TP8 DP1.
  N8193 OOM on mf=0.97 was FlashMLA prefill temp at 64 local heads; TP8
  (8 local heads) plus lower mf should let C2 sources run above K=512.
procedure:
  - Keep EXP-0003 probe contract: layers L2/L8/L14/L20, SHA-256 packed
    int32 (raw, physical) order vs lex-sorted set hashes, CUDA-graph D2D
    ring, D2H after each request, no fused sort, no SM120 kernel change.
  - Change only the authorized launch delta: drop --dp-size 8
    --enable-dp-attention --enable-dp-lm-head; keep --tp-size 8 --ep-size 4;
    set --mem-fraction-static 0.80 after moving Engram n-gram tables to host
    (SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE=1, LAYOUT=per_rank). v0.5.22 pins
    via cudaHostRegister always; no HOST_TABLE_PIN / DROP_PAGE_CACHE env.
    Without host table: 0.75 KV-refused (min 0.860), 0.88 SWA 1.97GB > 1.42GB.
  - Harvest on tp_rank==0 because attn_dp_size==1. Do not send routed_dp_rank.
  - Cheap matrix only: N511 and N8193 on source layers L2/L8/L14/L20.
  - N511: up to 30 serial requests until at least one token-4=15 and one
    token-4=32 pair exists, or 30 requests if that pair does not appear.
  - N8193: up to 10 serial requests; stop as soon as any C2 layer shows
    same score hash, same set hash, different order hash.
  - Require cached_tokens=0. Record meta_info.dp_rank (expected 0).
  - If N8193 C2 shows an order fork, add C2 causal AA/AB/BA/BB replay.
    Otherwise skip full-layer trace.
stop_conditions:
  - GPU occupied by a foreign process
  - serve dies or health is not 200
  - fused sort or SM120 attention kernel is changed
  - N8193 C2 same-score same-set different-order pair found (stop further N8193 requests)
  - N511 reached 30 requests or the 15/32 token-4 pair is in hand
